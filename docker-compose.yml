version: '3.8'

services:
  # Base vectorielle Qdrant (Recherche multimodale & hybride)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maintidoc_qdrant
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    restart: unless-stopped

  # Stockage Objet MinIO (Archivage sécurisé des PDF et images du corpus)
  minio:
    image: minio/minio:latest
    container_name: maintidoc_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: maintidoc_admin
      MINIO_ROOT_PASSWORD: maintidoc_secret_password_2026
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  minio_data:
